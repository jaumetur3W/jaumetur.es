<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Badge -->
  <defs>
    <radialGradient id="badgeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f8f2e4"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3a3935" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="230" fill="url(#badgeGrad)" stroke="#3a3935" stroke-width="12" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="212" fill="none" stroke="#d23f45" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Oven Arch Graphic -->
  <path d="M140 230 A 110 110 0 0 1 360 230" fill="none" stroke="#3a3935" stroke-width="16" stroke-linecap="round"/>
  <path d="M165 230 A 85 85 0 0 1 335 230" fill="none" stroke="#e08e2b" stroke-width="6" stroke-linecap="round"/>

  <!-- Arch Bricks Pattern -->
  <g stroke="#3a3935" stroke-width="4" stroke-linecap="round">
    <line x1="250" y1="120" x2="250" y2="145"/>
    <line x1="205" y1="130" x2="215" y2="152"/>
    <line x1="295" y1="130" x2="285" y2="152"/>
    <line x1="165" y1="158" x2="180" y2="175"/>
    <line x1="335" y1="158" x2="320" y2="175"/>
    <line x1="140" y1="198" x2="160" y2="208"/>
    <line x1="360" y1="198" x2="340" y2="208"/>
  </g>

  <!-- Pizza Slice in Center -->
  <g transform="translate(250, 215) scale(1.15)">
    <!-- Crust -->
    <path d="M-38 -15 Q0 -26 38 -15 Q40 5 0 60 Q-40 5 -38 -15 Z" fill="#d97706" stroke="#b45309" stroke-width="3"/>
    <!-- Cheese & Sauce -->
    <path d="M-32 -10 Q0 -20 32 -10 Q34 8 0 52 Q-34 8 -32 -10 Z" fill="#fbbf24"/>
    <path d="M-28 -8 Q0 -16 28 -8 Q22 15 0 44 Q-22 15 -28 -8 Z" fill="#ef4444" opacity="0.35"/>
    <!-- Pepperoni / Toppings -->
    <circle cx="-10" cy="5" r="7" fill="#b91c1c"/>
    <circle cx="12" cy="12" r="6" fill="#b91c1c"/>
    <circle cx="0" cy="28" r="5" fill="#b91c1c"/>
    <!-- Basil leaves -->
    <path d="M-5 -2 Q-12 -12 2 -8 Q0 -2 -5 -2 Z" fill="#2f8f4e"/>
    <path d="M8 0 Q18 -5 12 6 Q7 4 8 0 Z" fill="#2f8f4e"/>
  </g>

  <!-- Tricolore Dots -->
  <circle cx="210" cy="315" r="8" fill="#2f8f4e"/>
  <circle cx="250" cy="315" r="8" fill="#fff" stroke="#3a3935" stroke-width="2"/>
  <circle cx="290" cy="315" r="8" fill="#d23f45"/>

  <!-- Brand Typography -->
  <!-- "LA PIZZERÍA" -->
  <text x="250" y="365" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="900" fill="#3a3935" letter-spacing="3">LA PIZZERÍA</text>

  <!-- "PIZZA ARTESANA" -->
  <text x="250" y="395" text-anchor="middle" font-family="'Nunito Sans', Arial, sans-serif" font-size="14" font-weight="800" fill="#d23f45" letter-spacing="6">PIZZA ARTESANA</text>

  <!-- "DEMO · TEMPLATE" -->
  <rect x="180" y="415" width="140" height="24" rx="12" fill="#3a3935"/>
  <text x="250" y="431" text-anchor="middle" font-family="'Nunito Sans', Arial, sans-serif" font-size="10" font-weight="800" fill="#f8f2e4" letter-spacing="2">DEMO TEMPLATE</text>
</svg>

