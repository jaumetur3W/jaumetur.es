<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(900px 600px at 18% 96%, rgba(255, 255, 0, 0.42), transparent 70%),
      radial-gradient(700px 500px at 86% 8%, rgba(255, 255, 0, 0.22), transparent 70%),
      #fbfbfa;
    font-family: Arial, sans-serif;
  }
  .ink { color: #111; }
  .abs { position: absolute; }
  .shot { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }

  /* ---- portátil (Avisa) ---- */
  .laptop-lid { left: 46px; top: 18px; width: 452px; height: 282px; background: #111; border-radius: 14px 14px 4px 4px; padding: 14px 14px 0; box-sizing: border-box; }
  .laptop-lid .scr { width: 100%; height: 100%; overflow: hidden; border-radius: 4px 4px 0 0; }
  .laptop-base { left: 24px; top: 300px; width: 500px; height: 22px; background: #d9d9d4; border: 3px solid #111; border-radius: 0 0 16px 16px; box-sizing: border-box; }
  .laptop-base::before { content: ''; position: absolute; left: 50%; top: 0; width: 120px; height: 9px; margin-left: -60px; background: #111; border-radius: 0 0 8px 8px; }

  /* ---- monitor (Worksy) ---- */
  .mon { left: 648px; top: 82px; width: 668px; height: 418px; background: #111; border-radius: 16px; padding: 16px; box-sizing: border-box; }
  .mon .scr { width: 100%; height: 100%; overflow: hidden; border-radius: 4px; }
  .mon-neck { left: 938px; top: 500px; width: 90px; height: 92px; background: linear-gradient(90deg, #2a2a2a, #111 50%, #2a2a2a); }
  .mon-foot { left: 840px; top: 590px; width: 290px; height: 16px; background: #111; border-radius: 10px 10px 4px 4px; }

  /* ---- móvil (TranIA) ---- */
  .phone { left: 1318px; top: 344px; width: 226px; height: 620px; background: #111; border-radius: 38px; padding: 12px; box-sizing: border-box; }
  .phone .scr { width: 100%; height: 100%; overflow: hidden; border-radius: 28px; position: relative; }
  .phone .notch { position: absolute; left: 50%; top: 10px; width: 70px; height: 18px; margin-left: -35px; background: #111; border-radius: 10px; z-index: 2; }

  /* ---- bot de TranIA saliendo de la pantalla ---- */
  .glow { left: 1300px; top: 120px; width: 260px; height: 260px; border-radius: 50%; background: #ffff00; opacity: .85; filter: blur(34px); }
  .bot { left: 1352px; top: 176px; width: 170px; height: 214px; }
  .shadow { left: 1270px; top: 930px; width: 310px; height: 26px; border-radius: 50%; background: rgba(17,17,17,.18); filter: blur(10px); }
  .shadow2 { left: 18px; top: 318px; width: 510px; height: 20px; border-radius: 50%; background: rgba(17,17,17,.14); filter: blur(10px); }
</style>
</head>
<body>

<!-- Portátil: Avisa -->
<div class="abs laptop-lid">
  <div class="scr"><img class="shot" src="file:///C:/Users/User/Desktop/jaumetur3W/jaumetur.es/public/img/hero/avisa-live.png" alt=""></div>
</div>
<div class="abs laptop-base"></div>
<div class="abs shadow2"></div>

<!-- Monitor: Worksy -->
<div class="abs mon">
  <div class="scr"><img class="shot" src="file:///C:/Users/User/Desktop/jaumetur3W/jaumetur.es/public/img/real/worksy-dashboard.webp" alt=""></div>
</div>
<div class="abs mon-neck"></div>
<div class="abs mon-foot"></div>

<!-- Móvil: TranIA -->
<div class="abs shadow"></div>
<div class="abs phone">
  <div class="scr">
    <div class="notch"></div>
    <img class="shot" style="object-position: 74% 0" src="file:///C:/Users/User/Desktop/jaumetur3W/jaumetur.es/public/img/real/trania-exercises.webp" alt="">
  </div>
</div>

<!-- Bot (IA de TranIA) -->
<div class="abs glow"></div>
<svg class="abs bot" viewBox="0 0 170 214" xmlns="http://www.w3.org/2000/svg">
  <!-- antena -->
  <line x1="85" y1="6" x2="85" y2="30" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <circle cx="85" cy="6" r="9" fill="#ffff00" stroke="#111" stroke-width="4"/>
  <!-- cabeza -->
  <rect x="22" y="30" width="126" height="92" rx="26" fill="#ffffff" stroke="#111" stroke-width="5"/>
  <!-- visera -->
  <rect x="36" y="54" width="98" height="46" rx="15" fill="#111"/>
  <circle cx="62" cy="77" r="10" fill="#ffff00"/>
  <circle cx="108" cy="77" r="10" fill="#ffff00"/>
  <rect x="70" y="94" width="30" height="5" rx="2.5" fill="#ffff00"/>
  <!-- cuerpo -->
  <rect x="36" y="130" width="98" height="62" rx="18" fill="#ffff00" stroke="#111" stroke-width="5"/>
  <text x="85" y="170" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900" fill="#111">IA</text>
  <!-- brazos -->
  <rect x="6" y="136" width="24" height="54" rx="12" fill="#ffffff" stroke="#111" stroke-width="5"/>
  <rect x="140" y="136" width="24" height="54" rx="12" fill="#ffffff" stroke="#111" stroke-width="5"/>
  <!-- piernas -->
  <rect x="52" y="192" width="22" height="18" rx="6" fill="#111"/>
  <rect x="96" y="192" width="22" height="18" rx="6" fill="#111"/>
</svg>

</body>
</html>
