<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>
    <linearGradient id="og-grad-indigo" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="og-card-bg" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1200" height="630" fill="url(#og-bg)" />

  <!-- Subtle Precision Grid -->
  <g opacity="0.35">
    <pattern id="og-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#94A3B8" />
    </pattern>
    <rect width="1200" height="630" fill="url(#og-grid)" />
  </g>

  <!-- Ambient Glowing Spots -->
  <circle cx="1050" cy="150" r="280" fill="#818CF8" opacity="0.18" filter="blur(60px)" />
  <circle cx="150" cy="500" r="220" fill="#38BDF8" opacity="0.15" filter="blur(50px)" />

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="36" stroke="#E2E8F0" stroke-width="2" />

  <!-- Content Group -->
  <g transform="translate(90, 90)">
    <!-- Brand Monogram -->
    <g transform="translate(0, 0)">
      <rect width="90" height="90" rx="26" fill="url(#og-card-bg)" />
      <rect x="1" y="1" width="88" height="88" rx="25" stroke="#334155" stroke-opacity="0.6" stroke-width="2" />
      <path
        d="M20 26C20 23.7909 21.7909 22 24 22H66C68.2091 22 70 23.7909 70 26V30C70 32.2091 68.2091 34 66 34H51V58C51 62.4183 47.4183 66 43 66C38.5817 66 35 62.4183 35 58V43C35 41.3431 33.6569 40 32 40C30.3431 40 29 41.3431 29 43V58C29 65.732 35.268 72 43 72C50.732 72 57 65.732 57 58V34H66C68.2091 34 70 32.2091 70 30"
        fill="url(#og-grad-indigo)"
      />
      <circle cx="64" cy="55" r="4" fill="#06B6D4" />
    </g>

    <!-- Badge: Available for projects -->
    <g transform="translate(114, 25)">
      <rect width="320" height="40" rx="20" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5" />
      <circle cx="24" cy="20" r="5" fill="#10B981" />
      <text x="40" y="25" font-family="system-ui, -apple-system, monospace" font-size="13" font-weight="700" fill="#065F46" letter-spacing="0.05em">
        DISPONIBLE PER A PROJECTES
      </text>
    </g>

    <!-- Headline Title -->
    <text x="0" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#0F172A" letter-spacing="-0.03em">
      Jaume Tur
    </text>
    <text x="0" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#4F46E5" letter-spacing="-0.01em">
      Desenvolupador Frontend &amp; Web Apps
    </text>

    <!-- Subtitle / Bio -->
    <text x="0" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#475569">
      Especialista en arquitectures Angular modulars, rendiment 60 FPS,
    </text>
    <text x="0" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#475569">
      accessibilitat WCAG 2.2 AA i automatització de pipelines CI/CD.
    </text>

    <!-- Tech Chips Pills -->
    <g transform="translate(0, 400)">
      <!-- Chip 1: Angular -->
      <rect x="0" y="0" width="130" height="44" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="24" y="27" font-family="system-ui, monospace" font-size="15" font-weight="700" fill="#E11D48">Angular</text>

      <!-- Chip 2: TypeScript -->
      <rect x="146" y="0" width="154" height="44" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="170" y="27" font-family="system-ui, monospace" font-size="15" font-weight="700" fill="#2563EB">TypeScript</text>

      <!-- Chip 3: 60 FPS -->
      <rect x="316" y="0" width="134" height="44" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="340" y="27" font-family="system-ui, monospace" font-size="15" font-weight="700" fill="#059669">60 FPS</text>

      <!-- Chip 4: WCAG AA -->
      <rect x="466" y="0" width="154" height="44" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="490" y="27" font-family="system-ui, monospace" font-size="15" font-weight="700" fill="#4F46E5">WCAG AA</text>

      <!-- Chip 5: CI/CD -->
      <rect x="636" y="0" width="130" height="44" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="660" y="27" font-family="system-ui, monospace" font-size="15" font-weight="700" fill="#0284C7">CI/CD</text>
    </g>

    <!-- Domain Footer -->
    <text x="0" y="475" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#94A3B8">
      https://jaumetur.es • València, Espanya
    </text>
  </g>
</svg>
